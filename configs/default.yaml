# =============================================================================
# Default configuration -- tabletop component-collection sweeping simulator.
#
# Coordinate convention
#   * table plane   : XY,  table normal: +Z (up)
#   * table top     : z = 0   (all heights are relative to the table surface)
#   * target tray   : fixed at the LEFT (-X) edge; successful sweeps move
#                     components towards -X
#
# Units: metres, newtons, seconds, radians.
# =============================================================================

seed: 0

sim:
  physics_dt: 0.001          # MuJoCo timestep (must be < the control period)
  control_hz: 100.0          # outer hybrid-controller rate
  max_episode_time: 320.0    # simulated-seconds budget for one episode
  gravity: [0.0, 0.0, -9.81]
  solver_iterations: 50
  real_time: true

table:
  half_size: [0.50, 0.40, 0.02]
  top_z: 0.0
  friction: [0.6, 0.005, 0.0001]
  height_perturb_std: 0.0    # domain randomisation of the table height [m]

target:
  # Shallow tray, open towards +X, its floor being the table surface itself.
  # Shifted 3 cm toward the table centre so the loaded final push is shorter.
  x_min: -0.45
  x_max: -0.31
  y_min: -0.18
  y_max: 0.18
  wall_thickness: 0.012
  wall_height: 0.04

end_effector:
  type: ur10e                # ur10e Menagerie model | cartesian3dof (legacy)
  # High, thin sweeping plate held by a fixed-closed Robotiq 2F-85.  The
  # gripper is visual/fixed only and adds no ACT action dimension.
  brush_width: 0.14
  brush_depth: 0.008
  brush_height: 0.060
  brush_handle_thickness: 0.012
  brush_handle_depth: 0.024
  brush_handle_length: 0.100
  brush_handle_center_z: 0.180
  gripper_mass: 0.90
  # Rubber/bristle-facing equivalent: enough lateral grip to retain small
  # fasteners without adding non-physical side walls to the flat brush plate.
  brush_friction: [1.20, 0.01, 0.0004]
  # Equivalent compliance of the whole brush plate.  A high contact priority
  # makes this pair-specific: brush/table and brush/part contacts are soft,
  # while part/table dynamics keep their original crisp contact parameters.
  brush_contact_solref: [0.25, 1.0]
  brush_contact_solimp: [0.90, 0.95, 0.001]
  brush_contact_priority: 2
  # Coaxial tool mount: only the camera uses the side adapter; the brush must
  # rotate around the terminal wrist axis with the end effector.
  brush_mount_pos: [0.0, 0.10, 0.0]
  brush_mass: 0.25
  base_pos: [0.62, 0.0, 0.22]     # raised side mount; keeps the tray lane reachable
  z_home: 0.10                  # demonstration start: 10 cm above the table
  gravity_compensation: true
  joint_kp: 120.0
  joint_kd: 12.0
  ik_damping: 0.01
  ik_iterations: 60
  ik_max_joint_step: 0.04     # target slew limit per task-space command [rad]
  ik_position_tolerance: 0.005  # reject an unreachable Cartesian target [m]
  ik_orientation_tolerance: 0.02 # fixed roll/pitch/yaw residual [rad]
  # Level-brush IK seed for the longer gripper/handle stack at [0.42, 0, 0.10].
  initial_joint_positions: [-2.0863766, -2.4147117, -2.7304231, 3.5743388, 1.5707965, 3.6571730]
  # Retained only for the original Cartesian diagnostic scene.
  yaw_enabled: true
  kp: 3000.0
  kd: 12.0
  yaw_kp: 300.0
  yaw_kd: 3.0
  mass: 0.25
  tip_half: [0.008, 0.012, 0.030]
  tip_gap: 0.004
  # Eye-in-hand view: a short side adapter beside the final wrist joint.  The
  # pose is in wrist_3_link coordinates, not brush/tool coordinates.
  wrist_camera:
    # Start from the edge-on mount and rotate the complete camera rigidly by
    # -25 degrees about the wrist-3 local +Y axis.  At the level-brush pose
    # this local axis is the vertical installation centreline (world +Z), not
    # the wrist frame's local Z.  The local Y offset therefore stays fixed
    # while the camera's X/Z offset and optical frame orbit together.  The
    # negative sign places the camera on the unobstructed side of the brush.
    pos: [-0.080297, -0.05, 0.172198]
    # MuJoCo cameras look along local -Z and use local +Y as image up.
    xyaxes: [0.906308, 0.0, 0.422618, 0.225675, 0.845489, -0.483962]
    fovy_deg: 68.0

workspace:
  # Region the TCP may travel in.  x_min reaches inside the tray mouth so the
  # stroke can deposit components past the tray entrance.
  x_min: -0.42
  x_max: 0.46
  y_min: -0.32
  y_max: 0.32
  z_travel: 0.06             # lift height for contact-free transfer motions
  z_search_start: -0.00013   # calibrated virtual preload for the compliant brush contact
  z_search_min: -0.012       # deepest probing height before declaring "no table"
  observe_pose: [0.44, -0.34, 0.26]   # parking pose used for re-observation
  # Larger box: components outside it are counted as lost.
  safe_x_min: -0.52
  safe_x_max: 0.52
  safe_y_min: -0.42
  safe_y_max: 0.42

controller:
  desired_force: 1.0         # fixed positive normal force target [N]
  max_force: 5.0
  safe_max_force: 20.0       # user-approved transient safety ceiling [N]
  safe_force_dwell_steps: 3   # transient contact peaks must persist before aborting
  contact_threshold: 0.20
  release_threshold: 0.05
  force_ramp_rate: 15.0      # N/s, used for ramp-up and ramp-down
  force_filter_cutoff_hz: 12.0
  admittance:
    # Damping is sized against the *closed-loop* stiffness k_d + k_actuator
    # (~3060 N/m), not against k_d alone -- see README "Controller tuning".
    m: 1.0
    b: 120.0
    k: 60.0
  delta_z_limit: 0.001       # |delta_z| saturation [m]
  delta_z_rate_limit: 0.002  # |d(delta_z)/dt| saturation [m/s]
  # Fast upward-only compliance reflex layered on the slower admittance state.
  # It unloads transient UR10 pose-coupling peaks without integrating a new
  # force target or allowing a faster downward search.
  overforce_relief_gain: 0.00015  # m/N per control update above 1 N
  overforce_relief_limit: 0.001   # maximum upward reflex [m]
  search_velocity: 0.02      # downward probing speed [m/s]
  sweep_speed: 0.08          # slower for the longer gripper/brush lever arm [m/s]
  tray_entry_speed: 0.04     # slow only the final loaded push near the -X reach limit [m/s]
  recovery_speed: 0.04       # contact-preserving miss chase / tray exit [m/s]
  yaw_speed_limit: 0.7853981634  # 45 deg/s at the high-level reference grid
  travel_speed: 0.35         # XY speed for lifted transfer motions [m/s]
  z_speed: 0.08              # faster vertical approach / retract [m/s]
  contact_probe_depth: 0.001 # virtual preload used only by the contact actuator [m]
  control_delay_steps: 0     # artificial actuation delay, in control periods
  force_noise_std: 0.0       # additive Gaussian noise on the measured force
  force_sensor: contact      # contact | wrist_ft
  wrist_ft_sign: -1.0        # maps the wrist sensor z to "pressing positive"
  wrist_force_sign: 1.0      # world +Z external reaction is pressing-positive
  # Release guard: the desired force must already be ~0 at x_release_line, so
  # the ramp-down starts release_margin earlier.
  release_margin: 0.07
  x_release_line: -0.40

components:
  # Formal ACT demonstrations always start with six physical parts.  The
  # requested collection amount is configured independently under ``task``.
  count: 6
  geometry: mixed
  size_scale: 1.0
  mass: {min: 0.004, max: 0.012}
  friction: {min: 0.40, max: 0.80}
  spawn: {x_min: -0.08, x_max: 0.36, y_min: -0.26, y_max: 0.26}
  spawn_mode: cluster
  # Exact N<6 demonstrations still keep all six parts, but use the same
  # concentrated cluster as the six-part task so the preview matches the
  # intended continuous-sweep scene.
  exact_partial_spawn_mode: cluster
  cluster:                   # only used when spawn_mode == cluster
    # The group centre is random per seed, but drawn from a bounded normal
    # distribution around the canonical work area.  This preserves layout
    # diversity without making ACT learn a large, unnecessary translation.
    center_mean: [0.20, 0.00]
    center_std: [0.035, 0.025]
    center_bounds: {x_min: 0.10, x_max: 0.28, y_min: -0.10, y_max: 0.10}
    # Legacy broad bounds are retained for older override files.  New runs
    # use center_mean/center_std/center_bounds above.
    center_x: {min: 0.02, max: 0.34}
    center_y: {min: -0.16, max: 0.16}
    spread_std: {min: 0.025, max: 0.045}
    max_radius: 0.085
  min_separation: 0.035
  randomize_orientation: true
  target_clearance: 0.05

perception:
  backend: ground_truth      # ground_truth | vision (legacy planner backend)
  camera:
    pos: [0.62, 0.24, 0.62]  # fixed high-oblique view, never moves
    lookat: [-0.02, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]
    fovy_deg: 58.0
    width: 640
    height: 480
  segmentation: mujoco       # mujoco | color | depth
  depth_threshold: 0.004     # [m] above the fitted table plane (depth mode)
  depth_convention: optical_axis   # optical_axis | euclidean (MuJoCo renders the former)
  color_threshold: 0.55      # grayscale threshold (color mode)
  plane_offset: 0.003        # back-project onto z = table_top + this [m]
  grid_res: 0.008            # table-plane occupancy grid resolution [m]
  typical_component_area: 8.0e-5   # [m^2], used to estimate counts from blob area
  min_blob_pixels: 6
  noise:
    position_std: 0.0
    dropout: 0.0
    false_positive_rate: 0.0

planner:
  name: fixed                # fixed | visual_greedy
  max_strokes: 20
  lane_overlap: 0.15         # fraction of the pusher width overlapped between lanes
  consolidation: true        # final consolidation stroke in front of the tray
  consolidation_lead: 0.18
  stroke_end_x: -0.40        # where every sweeping stroke terminates
  stroke_lead_in: 0.06       # start this far to the +X side of the target cluster
  tray_margin: 0.05          # keep stroke end points this far inside the tray in y
  align_yaw: true            # rotate the pusher face perpendicular to the stroke
  interpolation: trapezoidal # trapezoidal | quintic
  accel: 0.8                 # [m/s^2] for the trapezoidal profile
  # One-pass exact-count expert planner.  These belong to the planner (not
  # ACT model) namespace so changing the policy configuration cannot silently
  # alter expert geometry.
  expert_grid_resolution: 0.01
  expert_obstacle_margin: 0.008
  expert_staging_margin: 0.018
  expert_target_edge_limit: 0.16
  expert_turn_penalty: 0.015  # [m] cost for a 180-degree heading change
  expert_turn_score_weight: 0.010  # [m] per meaningful path turn
  expert_capture_margin: 0.015  # [m] reserve at each target's strip edge
  expert_capture_score_weight: 0.40  # [m] prefer centred target crossings
  expert_robustness_margin: 0.010  # [m] clearance reserve against distractor carry
  expert_clearance_score_weight: 0.20
  expert_candidate_limit: 12  # shortlist for optional MuJoCo-in-the-loop validation
  expert_capture_exit_margin: 0.02  # [m] clear selected parts before changing lanes
  # Search both the brush heading and several offsets inside the common
  # capture corridor.  The latter matters when the corridor midpoint grazes
  # a distractor even though one side of the same corridor is safe.
  expert_capture_angles_deg: [-75, -60, -45, -30, -15, 0, 15, 30, 45, 60, 75]
  expert_lane_fractions: [0.15, 0.35, 0.50, 0.65, 0.85]
  expert_tray_entry_margin: 0.02  # [m] align with the tray lane before crossing its mouth
  expert_tray_push_depth: 0.09    # [m] brush-centre depth inside the tray after crossing
  stall_virtual_tray_offset: 0.14  # [m] lateral offset of the virtual tray used for stall failures
  transfer:
    # Motion planning for the CONTACT-FREE transfer legs only. The sweeping
    # stroke is always a straight Cartesian segment -- see sim/planners/rrt.py
    # for why a sampling planner must not touch it.
    mode: direct             # direct | rrt
    step_size: 0.05          # RRT extension length [m]
    goal_bias: 0.15
    max_iters: 3000
    shortcut_iters: 100
    max_waypoints: 8
    resolution: 0.005        # segment collision-check spacing [m]
    clearance: 0.004         # extra margin around obstacles [m]
    avoid_components: true   # route around parts already detected on the table
    component_clearance: 0.010
    component_height: 0.012

  greedy:
    lambda_path: 0.35
    mu_risk: 1.20
    cluster_eps: 0.055
    n_lane_candidates: 21
    yaw_candidates: [0.0]
    capture_halfwidth_pad: 0.004
    max_no_progress: 4

video:
  # Preview/recording views.  ``overhead_cam`` is also the ACT global-view
  # input; the inspection camera remains human-only.
  cameras: [scene_cam, overhead_cam]   # panes, left to right
  width: 640
  height: 480
  fps: 25
  every_n_control_steps: 4   # 100 Hz control / 4 -> 25 fps, i.e. real time
  hud: true
  format: mp4                # mp4 | gif
  quality: 7                 # libx264 quality, 0-10
  force_gauge_max: null      # HUD force-gauge full scale [N]; null -> 2.5 * desired_force
  extra_cameras:
    overhead_cam:
      # Kept under the historical ``overhead_cam`` name for the ACT input
      # contract; geometrically this is now a front-oblique global view.
      # Opposite side from the prior negative-Y view, and slightly higher, so
      # the forearm no longer sits over the brush stroke and components.
      # About 17 degrees counter-clockwise around the table centre, with a
      # tighter radius and a slightly higher elevation than the prior view.
      pos: [0.10, 0.64, 0.82]
      lookat: [-0.04, 0.0, 0.0]
      up: [0.0, 0.0, 1.0]
      fovy_deg: 48.0
    side_cam:
      pos: [0.05, -0.80, 0.17]
      lookat: [-0.14, 0.0, 0.02]
      up: [0.0, 0.0, 1.0]
      fovy_deg: 40.0
    follow_cam:
      mode: targetbody       # stays put, rotates to keep the tool centred
      target: tool
      pos: [0.30, -0.55, 0.40]
      fovy_deg: 45.0
    inspection_cam:
      # Human-only far oblique-front-above view: frame the complete UR10e,
      # table and the -X collection tray in one square inspection pane.
      pos: [1.10, -1.45, 1.15]
      lookat: [0.05, 0.0, 0.24]
      up: [0.0, 0.0, 1.0]
      fovy_deg: 52.0

act:
  enabled: true
  # ordinary = the schema-v4 baseline; objectact = schema-v5 ObjectACT-BEV.
  # The latter is opt-in so legacy ACT checkpoints and workbench playback do
  # not change when the perception experiment is enabled.
  policy_variant: ordinary
  image_size: [320, 320]
  camera_hz: 25.0
  query_hz: 5.0
  action_hz: 25.0
  chunk_size: 25
  execute_steps: 5
  horizon_seconds: 1.0
  # Sparse 5 Hz queries produce overlapping chunks.  Fuse accepted chunks in
  # the timestamped executor; this is intentionally separate from LeRobot's
  # n_action_steps=1 policy ensembler, which is incompatible with this cadence.
  temporal_ensemble_coeff: 0.01
  state_history: true
  observation_keys: [observation.images.overhead, observation.images.wrist,
                     observation.state, observation.environment_state]
  # Full-episode fixed-frame consecutive [dx, dy, dz, dyaw].  ACT owns all
  # four axes before contact; after the force latch its dz output is logged but
  # ignored while the 1 N admittance loop owns physical Z.
  action_dim: 4
  state_dim: 42
  device: mps
  batch_size: 4
  image_stat_samples: 100
  max_steps: 80000
  checkpoint_every_steps: 2500
  keep_checkpoints: 3
  train_hours: 24
  dataset_dir: runs/act_dataset
  model_dir: runs/act_model
  objectact_dataset_dir: runs/objectact_dataset
  objectact_model_dir: runs/objectact_model
  objectact_detector_dataset_dir: runs/objectact_detector_dataset
  objectact_detector_model_dir: runs/objectact_detector
  objectact_detector_checkpoint: null
  # Detector checkpoints trained with ImageNet initialization normalize RGB
  # inside the detector forward; keep training and runtime contracts aligned.
  objectact_detector_pretrained: true
  objectact_detector_foreground_threshold: 0.60
  objectact_pretrained_weights: ResNet18_Weights.IMAGENET1K_V1
  # The default policy sees binary topology and target cardinality, not the
  # expert's offline choice of object identities.  Enable only for ablations.
  objectact_use_selection_channel: false
  objectact_cumulative_action_loss_weight: 0.5
  realtime_budget_seconds: 0.2
  approach_sample_fraction: 0.35
  tracking_project: act-ur10-sweep-full-episode-v1
  tracking_space: Luke711/act-ur10-sweep-tracking
  tracking_private: true

task:
  total_count: 6
  target_count: 3
  target_mode: exact
  contact_start_xy: [0.42, 0.0]

web:
  host: 127.0.0.1
  port: 8765
  refresh_hz: 5.0

episode:
  max_time: 45.0
  max_frames: 500         # hard cap at the 25 Hz task/data-frame level
  max_contact_path: 3.0
  contact_build_time: 1.0   # supervisor hold before ACT receives XY+yaw control
  stable_time: 1.0  # expert-data confirmation hold; inference uses its own timers below
  brush_inside_target_timeout: 1.0  # expert-data brush-depth failure condition only
  inference_target_hold_time: 2.0  # ACT keeps issuing actions after reaching >=N
  inference_collection_stall_timeout: 3.0  # stop after no new full entry
  # Official demonstrations are a single continuous contact pass.  Recovery
  # utilities remain available for separate experiments, but are not appended
  # to an expert label.
  expert_recovery_rounds: 0
  settle_time: 0.4
  success_collection_rate: 1.0

metrics:
  # Failure-mode detection thresholds (see README "Failure modes").
  jam_force_threshold: 4.0      # [N] tangential force that counts as a jam
  jam_min_duration: 0.08        # [s] it must be sustained for
  ride_over_move_threshold: 0.004   # [m] below this a swept component "did not move"
  ride_over_pad: 0.002          # [m] widening of the capture band for the test
  touchdown_window: 0.5         # [s] of SWEEP included in the touchdown transient

logging:
  out_dir: runs
  save_plots: true
  save_trace: true

dataset:
  out_dir: datasets/sweep_v1
  wrench_history_steps: 10   # control steps of 6-axis wrench stored per observation
  save_images: true
  image_format: png
  only_successful: true
