<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAC-ACT · Training workbench</title>
<style>
:root{color-scheme:dark;--bg:oklch(20% .015 230);--panel:oklch(24% .018 230);--ink:oklch(95% .01 210);--muted:oklch(76% .025 215);--line:oklch(39% .025 230);--accent:oklch(80% .12 165)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:32px}header,.toolbar,nav{display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap}h1{font-size:26px;margin:0;letter-spacing:-.02em}h2{font-size:18px;margin:0 0 16px}p{color:var(--muted);max-width:72ch}a{color:var(--accent)}section{margin:26px 0;padding-top:24px;border-top:1px solid var(--line)}.metrics{display:flex;flex-wrap:wrap;gap:28px;margin:24px 0}.metrics div{min-width:150px}.metrics dt{color:var(--muted)}.metrics dd{font-size:23px;margin:4px 0;font-variant-numeric:tabular-nums}#status{color:var(--accent)}.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}.plot{background:var(--panel);padding:16px;border-radius:8px}.plot h3{margin:0 0 6px;font-size:14px;font-weight:500}.plot svg{width:100%;height:auto;display:block}.axis{fill:var(--muted);font:11px system-ui}.gridline{stroke:var(--line);stroke-width:.5}.raw{fill:none;stroke:var(--accent);opacity:.28;stroke-width:1}.smooth{fill:none;stroke:var(--accent);stroke-width:2}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td:last-child{white-space:normal;min-width:220px}button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:5px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.empty{padding:24px;color:var(--muted)}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}#error{color:oklch(82% .12 25)}nav{margin-top:16px}.sub{font-size:12px;color:var(--muted)}@media(max-width:600px){main{padding:18px}.metrics{gap:16px}.metrics div{min-width:130px}}
</style>
<main><header><div><h1>Hybrid PAC-ACT</h1><p>A* → frozen ACT warmup → action-chunk PPO · 独立训练工作台</p></div><span id="status" role="status">等待状态</span></header>
<div class="toolbar"><span id="run" class="sub">只读监控，不控制训练进程</span><a href="http://127.0.0.1:6007/" target="_blank" rel="noopener">TensorBoard ↗</a></div>
<p id="error" role="alert"></p><dl class="metrics" id="metrics"></dl>
<section><div class="toolbar"><h2>优化曲线</h2><label>EMA 平滑 <input id="ema" type="range" min="0" max=".99" step=".01" value=".6"></label></div><div class="plots" id="plots"></div><p class="sub">浅线为原始值，实线为 EMA；横轴为完整接受的更新次数。回报和严格成功率分开判断。</p></section>
<section><h2>训练效果</h2><div class="plots" id="training-plots"></div><p class="sub">横轴为训练回合序号；成功率与数量误差取最近最多 30 回合，不混入验证结果。回报改善不等于严格成功率提高。</p></section>
<section><h2>训练与验证回合</h2><div class="table-scroll"><table><thead><tr><th>Seed / phase</th><th>目标 → 实际</th><th>严格成功</th><th>有效动作</th><th>环境回报</th><th>腕力峰值</th><th>终止原因</th></tr></thead><tbody id="episodes"></tbody></table></div><nav><div><button id="previous">上一页</button> <span id="pagination"></span> <button id="next">下一页</button></div><label>每页 <select id="size"><option>25</option><option>50</option><option>100</option></select></label></nav></section>
<section><h2>Checkpoint</h2><div id="saves" class="sub"></div></section><section><h2>验证结果</h2><div id="validation"></div></section></main>
<script>
let page=1,last=null;const $=id=>document.getElementById(id);const fmt=(v,n=0)=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:n});
function text(tag,value){let e=document.createElement(tag);e.textContent=value;return e}
function plot(rows,key,title){const box=document.createElement('div');box.className='plot';box.append(text('h3',title));const points=rows.filter(r=>Number.isFinite(r[key]));if(!points.length){let e=text('div','暂无更新数据');e.className='empty';box.append(e);return box}let low=Math.min(...points.map(r=>r[key])),high=Math.max(...points.map(r=>r[key]));if(low===high){low-=1;high+=1}const pad=(high-low)*.06;low-=pad;high+=pad;const x0=48,y0=12,w=410,h=170,xmin=points[0].update??0,xmax=points.at(-1).update??1,s=Number($('ema').value);let avg=points[0][key];const raw=[],smooth=[];for(const r of points){avg=s*avg+(1-s)*r[key];const x=x0+((r.update??0)-xmin)/Math.max(1,xmax-xmin)*w;raw.push([x,y0+(high-r[key])/(high-low)*h]);smooth.push([x,y0+(high-avg)/(high-low)*h])}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 480 218');svg.setAttribute('role','img');svg.setAttribute('aria-label',title);const add=(tag,attrs,label)=>{let el=document.createElementNS(svg.namespaceURI,tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(label)el.textContent=label;svg.append(el)};for(let i=0;i<5;i++){let y=y0+h*i/4;add('line',{x1:x0,x2:x0+w,y1:y,y2:y,class:'gridline'});add('text',{x:2,y:y+4,class:'axis'},(high-(high-low)*i/4).toPrecision(3))}add('text',{x:x0,y:205,class:'axis'},String(xmin));add('text',{x:x0+w-15,y:205,class:'axis'},String(xmax));for(const [values,cls]of [[raw,'raw'],[smooth,'smooth']])add('path',{d:values.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '),class:cls});svg.addEventListener('mousemove',e=>{let rect=svg.getBoundingClientRect(),fraction=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));let r=points[Math.round(fraction*(points.length-1))];svg.setAttribute('title',`update ${r.update}: ${r[key]}`)});box.append(svg);return box}
function render(d){last=d;$('status').textContent=d.status.state||'尚未启动';$('run').textContent=d.status.reason||d.status.phase||'只读监控，不控制训练进程';const p=d.progress;$('metrics').replaceChildren();for(const [title,value]of [['已采集有效动作',fmt(p.sampled_actions)],['已用于更新',fmt(p.used_actions)],['已丢弃',fmt(p.discarded_actions)],['待提交',fmt(p.pending_actions)],['已接受更新',fmt(p.updates)],['回合数',fmt(d.total_episodes)]]){let group=document.createElement('div');group.append(text('dt',title),text('dd',value));$('metrics').append(group)}$('plots').replaceChildren();for(const [key,title]of [['actor_loss','Actor loss'],['value_loss','Value loss'],['exact_kl','Exact KL / rollout'],['entropy','Entropy'],['prior_cost','Normalized prior cost'],['environment_return','Environment return'],['optimization_return','Optimization return'],['std_xy_mm','XY exploration std / mm'],['std_yaw_deg','Yaw exploration std / degree']])$('plots').append(plot(d.updates,key,title));$('episodes').replaceChildren();for(const r of d.episodes){let row=document.createElement('tr');for(const v of [`${r.seed} / ${r.role}`,`${r.target_count} → ${r.final_collected??'未知'}`,r.success==null?'中断':r.success?'是':'否',fmt(r.active_actions),fmt(r.environment_return,2),fmt(r.peak_wrist_N,2)+' N',r.reason||'—'])row.append(text('td',v));$('episodes').append(row)}if(!d.episodes.length){let row=document.createElement('tr'),cell=text('td','尚无物理回合；预检或训练启动后更新。');cell.colSpan=7;cell.className='empty';row.append(cell);$('episodes').append(row)}page=d.page;$('pagination').textContent=`${d.page} / ${d.pages} · 共 ${d.total_episodes} 条`;$('previous').disabled=page<=1;$('next').disabled=page>=d.pages;const saves=[...(d.checkpoints.milestones||[]),...(d.checkpoints.slots||[])];$('saves').replaceChildren(...saves.map(s=>text('p',`${s.kind} · ${fmt(s.actions)} actions · ${fmt(s.bytes/2**20,1)} MiB · ${s.file}`)));if(!saves.length)$('saves').textContent='尚无 checkpoint。';$('validation').replaceChildren(...d.validations.map(v=>text('p',`${v.arm} · 严格成功 ${fmt(v.strict_success_rate*100,1)}% · MAE ${fmt(v.mean_absolute_error,2)} · ${v.episodes} episodes`)))}
function renderTraining(d){
  $('training-plots').replaceChildren();
  for(const [key,title] of [['episode_return','Environment return / episode'],['strict_success_percent','Strict success / %'],['mean_absolute_count_error','Mean absolute count error']])
    $('training-plots').append(plot(d.training_metrics||[],key,title));
  const blocks=document.createElement('div');blocks.append(text('dt','已采集 / 已使用动作块'),text('dd',`${fmt(d.progress.sampled_blocks)} / ${fmt(d.progress.used_blocks)}`));$('metrics').append(blocks);
  for(const v of d.validations){let link=document.createElement('a');link.href=`/validation_${encodeURIComponent(v.arm)}.png`;link.target='_blank';link.rel='noopener';link.textContent=`${v.arm} · 数量热力图 ↗`;let line=document.createElement('p');line.append(link);$('validation').append(line)}
}
async function refresh(){try{let response=await fetch(`/api?page=${page}&size=${$('size').value}`);if(!response.ok)throw Error(`HTTP ${response.status}`);const d=await response.json();render(d);renderTraining(d);$('error').textContent=''}catch(e){$('error').textContent=`暂时无法读取状态：${e.message}；保留上次显示。`}}
$('previous').onclick=()=>{page--;refresh()};$('next').onclick=()=>{page++;refresh()};$('size').onchange=()=>{page=1;refresh()};$('ema').oninput=()=>{if(last){render(last);renderTraining(last)}};refresh();setInterval(refresh,5000);
</script></html>
