# =============================================================================
# Default configuration -- tabletop component-collection sweeping simulator.
#
# Coordinate convention
#   * table plane   : XY,  table normal: +Z (up)
#   * table top     : z = 0   (all heights are relative to the table surface)
#   * target tray   : fixed at the LEFT (-X) edge; successful sweeps move
#                     components towards -X
#
# Units: metres, newtons, seconds, radians.
# =============================================================================

seed: 0

sim:
  physics_dt: 0.001          # MuJoCo timestep (must be < the control period)
  control_hz: 100.0          # outer hybrid-controller rate
  max_episode_time: 320.0    # simulated-seconds budget for one episode
  gravity: [0.0, 0.0, -9.81]
  solver_iterations: 50
  real_time: true

table:
  half_size: [0.50, 0.40, 0.02]
  top_z: 0.0
  friction: [0.6, 0.005, 0.0001]
  height_perturb_std: 0.0    # domain randomisation of the table height [m]

target:
  # Shallow tray, open towards +X, its floor being the table surface itself.
  x_min: -0.48
  x_max: -0.34
  y_min: -0.18
  y_max: 0.18
  wall_thickness: 0.012
  wall_height: 0.04

end_effector:
  type: ur10e                # ur10e Menagerie model | cartesian3dof (legacy)
  # High, thin sweeping plate held by a fixed-closed Robotiq 2F-85.  The
  # gripper is visual/fixed only and adds no ACT action dimension.
  brush_width: 0.14
  brush_depth: 0.008
  brush_height: 0.060
  brush_handle_thickness: 0.012
  brush_handle_depth: 0.024
  brush_handle_length: 0.100
  brush_handle_center_z: 0.180
  gripper_mass: 0.90
  # Rubber/bristle-facing equivalent: enough lateral grip to retain small
  # fasteners without adding non-physical side walls to the flat brush plate.
  brush_friction: [1.20, 0.01, 0.0004]
  # Coaxial tool mount: only the camera uses the side adapter; the brush must
  # rotate around the terminal wrist axis with the end effector.
  brush_mount_pos: [0.0, 0.10, 0.0]
  brush_mass: 0.25
  base_pos: [0.62, 0.0, 0.22]     # raised side mount; keeps the tray lane reachable
  z_home: 0.18
  gravity_compensation: true
  joint_kp: 120.0
  joint_kd: 12.0
  ik_damping: 0.01
  ik_iterations: 60
  ik_max_joint_step: 0.04     # target slew limit per task-space command [rad]
  # Level-brush IK seed for the longer gripper/handle stack at [0.42, 0, 0.18].
  initial_joint_positions: [-2.0863955, -2.0839338, -2.7731138, 3.2862509, 1.5708025, 3.6571918]
  # Retained only for the original Cartesian diagnostic scene.
  yaw_enabled: true
  kp: 3000.0
  kd: 12.0
  yaw_kp: 300.0
  yaw_kd: 3.0
  mass: 0.25
  tip_half: [0.008, 0.012, 0.030]
  tip_gap: 0.004
  # Eye-in-hand view: a short side adapter beside the final wrist joint.  The
  # pose is in wrist_3_link coordinates, not brush/tool coordinates.
  wrist_camera:
    # Side adapter on the final wrist.  It looks mostly along plate width, with
    # a slight downward/inward pitch, so the thin plate edge is a near-vertical
    # centre divider and the image is split into left/right regions.
    pos: [0.0, -0.05, 0.19]
    # Generated for wrist-local look-at [0, -0.17, 0] and local +Y image up.
    xyaxes: [1.0, 0.0, 0.0, 0.0, 0.845489, -0.533993]
    fovy_deg: 68.0

workspace:
  # Region the TCP may travel in.  x_min reaches inside the tray mouth so the
  # stroke can deposit components past the tray entrance.
  x_min: -0.42
  x_max: 0.46
  y_min: -0.32
  y_max: 0.32
  z_travel: 0.06             # lift height for contact-free transfer motions
  z_search_start: -0.001     # controlled 1 mm preload; avoids a zero-gap no-contact equilibrium
  z_search_min: -0.012       # deepest probing height before declaring "no table"
  observe_pose: [0.44, -0.34, 0.26]   # parking pose used for re-observation
  # Larger box: components outside it are counted as lost.
  safe_x_min: -0.52
  safe_x_max: 0.52
  safe_y_min: -0.42
  safe_y_max: 0.42

controller:
  desired_force: 1.0         # fixed positive normal force target [N]
  max_force: 5.0
  safe_max_force: 100.0       # calibrated official-UR10e demo ceiling [N]
  safe_force_dwell_steps: 3   # transient contact peaks must persist before aborting
  contact_threshold: 0.20
  release_threshold: 0.05
  force_ramp_rate: 15.0      # N/s, used for ramp-up and ramp-down
  force_filter_cutoff_hz: 12.0
  admittance:
    # Damping is sized against the *closed-loop* stiffness k_d + k_actuator
    # (~3060 N/m), not against k_d alone -- see README "Controller tuning".
    m: 1.0
    b: 120.0
    k: 60.0
  delta_z_limit: 0.006       # |delta_z| saturation [m]
  delta_z_rate_limit: 0.05   # |d(delta_z)/dt| saturation [m/s]
  search_velocity: 0.02      # downward probing speed [m/s]
  sweep_speed: 0.08          # slower for the longer gripper/brush lever arm [m/s]
  travel_speed: 0.35         # XY speed for lifted transfer motions [m/s]
  z_speed: 0.03              # vertical speed for approach / retract [m/s]
  control_delay_steps: 0     # artificial actuation delay, in control periods
  force_noise_std: 0.0       # additive Gaussian noise on the measured force
  force_sensor: contact      # contact | wrist_ft
  wrist_ft_sign: -1.0        # maps the wrist sensor z to "pressing positive"
  wrist_force_sign: 1.0      # world +Z external reaction is pressing-positive
  # Release guard: the desired force must already be ~0 at x_release_line, so
  # the ramp-down starts release_margin earlier.
  release_margin: 0.07
  x_release_line: -0.40

components:
  count: 3
  geometry: mixed
  size_scale: 1.0
  mass: {min: 0.004, max: 0.012}
  friction: {min: 0.40, max: 0.80}
  spawn: {x_min: -0.08, x_max: 0.36, y_min: -0.26, y_max: 0.26}
  spawn_mode: cluster
  cluster:                   # only used when spawn_mode == cluster
    center_x: {min: 0.02, max: 0.34}
    center_y: {min: -0.16, max: 0.16}
    spread_std: {min: 0.030, max: 0.060}
    max_radius: 0.11
  min_separation: 0.035
  randomize_orientation: true
  target_clearance: 0.05

perception:
  backend: ground_truth      # ground_truth | vision (legacy planner backend)
  camera:
    pos: [0.62, 0.24, 0.62]  # fixed high-oblique view, never moves
    lookat: [-0.02, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]
    fovy_deg: 58.0
    width: 640
    height: 480
  segmentation: mujoco       # mujoco | color | depth
  depth_threshold: 0.004     # [m] above the fitted table plane (depth mode)
  depth_convention: optical_axis   # optical_axis | euclidean (MuJoCo renders the former)
  color_threshold: 0.55      # grayscale threshold (color mode)
  plane_offset: 0.003        # back-project onto z = table_top + this [m]
  grid_res: 0.008            # table-plane occupancy grid resolution [m]
  typical_component_area: 8.0e-5   # [m^2], used to estimate counts from blob area
  min_blob_pixels: 6
  noise:
    position_std: 0.0
    dropout: 0.0
    false_positive_rate: 0.0

planner:
  name: fixed                # fixed | visual_greedy
  max_strokes: 20
  lane_overlap: 0.15         # fraction of the pusher width overlapped between lanes
  consolidation: true        # final consolidation stroke in front of the tray
  consolidation_lead: 0.18
  stroke_end_x: -0.40        # where every sweeping stroke terminates
  stroke_lead_in: 0.06       # start this far to the +X side of the target cluster
  tray_margin: 0.05          # keep stroke end points this far inside the tray in y
  align_yaw: true            # rotate the pusher face perpendicular to the stroke
  interpolation: trapezoidal # trapezoidal | quintic
  accel: 0.8                 # [m/s^2] for the trapezoidal profile
  transfer:
    # Motion planning for the CONTACT-FREE transfer legs only. The sweeping
    # stroke is always a straight Cartesian segment -- see sim/planners/rrt.py
    # for why a sampling planner must not touch it.
    mode: direct             # direct | rrt
    step_size: 0.05          # RRT extension length [m]
    goal_bias: 0.15
    max_iters: 3000
    shortcut_iters: 100
    max_waypoints: 8
    resolution: 0.005        # segment collision-check spacing [m]
    clearance: 0.004         # extra margin around obstacles [m]
    avoid_components: true   # route around parts already detected on the table
    component_clearance: 0.010
    component_height: 0.012

  greedy:
    lambda_path: 0.35
    mu_risk: 1.20
    cluster_eps: 0.055
    n_lane_candidates: 21
    yaw_candidates: [0.0]
    capture_halfwidth_pad: 0.004
    max_no_progress: 4

video:
  # Preview/recording views.  ``overhead_cam`` is also the ACT global-view
  # input; the inspection camera remains human-only.
  cameras: [scene_cam, overhead_cam]   # panes, left to right
  width: 640
  height: 480
  fps: 25
  every_n_control_steps: 4   # 100 Hz control / 4 -> 25 fps, i.e. real time
  hud: true
  format: mp4                # mp4 | gif
  quality: 7                 # libx264 quality, 0-10
  force_gauge_max: null      # HUD force-gauge full scale [N]; null -> 2.5 * desired_force
  extra_cameras:
    overhead_cam:
      # Kept under the historical ``overhead_cam`` name for the ACT input
      # contract; geometrically this is now a front-oblique global view.
      # Opposite side from the prior negative-Y view, and slightly higher, so
      # the forearm no longer sits over the brush stroke and components.
      pos: [0.30, 0.62, 0.80]
      lookat: [-0.04, 0.0, 0.0]
      up: [0.0, 0.0, 1.0]
      fovy_deg: 48.0
    side_cam:
      pos: [0.05, -0.80, 0.17]
      lookat: [-0.14, 0.0, 0.02]
      up: [0.0, 0.0, 1.0]
      fovy_deg: 40.0
    follow_cam:
      mode: targetbody       # stays put, rotates to keep the tool centred
      target: tool
      pos: [0.30, -0.55, 0.40]
      fovy_deg: 45.0
    inspection_cam:
      # Human-only far oblique-front-above view: frame the complete UR10e,
      # table and the -X collection tray in one square inspection pane.
      pos: [1.10, -1.45, 1.15]
      lookat: [0.05, 0.0, 0.24]
      up: [0.0, 0.0, 1.0]
      fovy_deg: 52.0

act:
  enabled: true
  image_size: [320, 320]
  camera_hz: 20.0
  query_hz: 5.0
  action_hz: 20.0
  chunk_size: 20
  execute_steps: 4
  horizon_seconds: 1.0
  state_history: true
  observation_keys: [observation.images.overhead, observation.images.wrist,
                     observation.state, observation.environment_state]
  action_dim: 4
  device: mps
  batch_size: 4
  max_steps: 50000
  train_hours: 24
  dataset_dir: runs/act_dataset
  model_dir: runs/act_model
  realtime_budget_seconds: 0.2

web:
  host: 127.0.0.1
  port: 8765
  refresh_hz: 5.0

episode:
  max_time: 45.0
  max_contact_path: 3.0
  stable_time: 1.0
  final_push_time: 0.8       # hold the last horizontal push for actuator settling [s]
  settle_time: 0.4
  success_collection_rate: 1.0

metrics:
  # Failure-mode detection thresholds (see README "Failure modes").
  jam_force_threshold: 4.0      # [N] tangential force that counts as a jam
  jam_min_duration: 0.08        # [s] it must be sustained for
  ride_over_move_threshold: 0.004   # [m] below this a swept component "did not move"
  ride_over_pad: 0.002          # [m] widening of the capture band for the test
  touchdown_window: 0.5         # [s] of SWEEP included in the touchdown transient

logging:
  out_dir: runs
  save_plots: true
  save_trace: true

dataset:
  out_dir: datasets/sweep_v1
  wrench_history_steps: 10   # control steps of 6-axis wrench stored per observation
  save_images: true
  image_format: png
  only_successful: true
